version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npm run dev
    container_name: jiraflow-api-dev
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=dev_jwt_secret_123
      - CLIENT_URL=http://localhost:5173

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: npm run dev -- --host
    container_name: jiraflow-ui-dev
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
